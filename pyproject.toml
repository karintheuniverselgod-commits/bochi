[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manga-search-telegram-bot"
version = "1.0.0"
description = "Telegram manga and manhwa search bot for KaliScan, Comick, and MangaDex"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21.0,<22.0",
  "httpx>=0.27.0,<1.0",
  "beautifulsoup4>=4.12.0,<5.0",
  "python-dotenv>=1.0.0,<2.0",
]
